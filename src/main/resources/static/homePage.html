<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CodeSwipe</title>

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="/styles/homePage.css"/>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="nav-top">
        <a href="/home" class="nav-item" id="now">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="/project/interested" class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Interested</span>
        </a>

        <a href="/project" class="nav-item">
            <i class="fa-solid fa-folder-open"></i>
            <span>My Projects</span>
        </a>

        <a href="/profile" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <div class="nav-bottom">
        <a href="/login" class="nav-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
    </div>
</div>

<div class="logo">CodeSwipe</div>

<div class="main">
    <div class="swipe-wrapper">
        <!-- LEFT BUTTON -->
        <button class="action-btn skip" onclick="swipeLeft()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <!-- CONTAINER FOR JS CARDS -->
        <div class="swipe-container" id="cardContainer">
            <!-- JavaScript will inject the card here -->
        </div>

        <!-- RIGHT BUTTON -->
        <button class="action-btn like" onclick="swipeRight()">
            <i class="fa-solid fa-heart"></i>
        </button>
    </div>
</div>


<script src="/js/utils.js"></script>
<script src="/js/homePage.js"></script>
</body>
</html>
