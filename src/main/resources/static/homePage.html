<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeSwipe</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="styles/homePage.css">
</head>
<body>

<div class="sidebar">
    <div class="nav-top">
        <div class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>

        <div class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Interested</span>
        </div>

        <!-- NEW: My Projects -->
        <div class="nav-item">
            <i class="fa-solid fa-folder-open"></i>
            <span>My Projects</span>
        </div>

        <!-- Profile moved here -->
        <div class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </div>
    </div>

    <div class="nav-bottom">
        <div class="nav-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </div>
    </div>
</div>

<div class="logo">CodeSwipe</div>

<div class="main">
    <div class="swipe-wrapper">

        <button class="action-btn skip" onclick="swipeLeft()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="swipe-container" id="cardContainer">

            <!-- PROJECT CARD -->
            <div class="project-card">
                <div class="polaroid">

                    <!-- HEADER -->
                    <div class="card-header">
                        <div class="avatar"></div>
                        <div class="header-info">
                            <h2>AI Study Planner</h2>
                            <span class="author">by Daniel Le</span>
                        </div>

                        <div class="difficulty-badge intermediate">
                            Intermediate
                        </div>
                    </div>

                    <!-- IMAGE -->
                    <div class="polaroid-image"></div>

                    <!-- CONTENT -->
                    <div class="polaroid-caption">

                        <p class="description">
                            An AI-powered web app that helps students organize tasks 
                            and optimize study schedules.
                        </p>

                        <div class="skills">
                            <span class="skill-tag">Java</span>
                            <span class="skill-tag">Spring Boot</span>
                            <span class="skill-tag">MySQL</span>
                            <span class="skill-tag">REST API</span>
                        </div>

                        <div class="difficulty-section">
                            <strong>Difficulty Level:</strong>
                            <span class="difficulty-text">Intermediate</span>
                        </div>

                    </div>

                </div>
            </div>

        </div>

        <button class="action-btn like" onclick="swipeRight()">
            <i class="fa-solid fa-heart"></i>
        </button>

    </div>
</div>

<script src="js/homePage.js"></script>
</body>
</html>
