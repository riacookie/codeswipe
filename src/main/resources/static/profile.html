<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - CodeSwipe</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="/styles/profile.css">
</head>
<body>

<div class="sidebar">
    <div class="nav-top">
        <a href="/home" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="/project/interested" class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Interested</span>
        </a>

        <a href="/project" class="nav-item">
            <i class="fa-solid fa-folder-open"></i>
            <span>My Projects</span>
        </a>

        <a href="/profile" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <div class="nav-bottom">
        <a href="/login" class="nav-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
    </div>
</div>

<div class="logo">CodeSwipe</div>

<div class="main">

    <div class="profile-card">

        <h1>My Profile</h1>

        <div class="avatar-section">
            <div class="avatar-preview" id="avatarPreview"></div>
            <label class="change-avatar">
                <i class="fa-solid fa-camera"></i> Change Avatar
                <input type="file" id="avatarInput" hidden>
            </label>
        </div>

        <form class="profile-form">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>GitHub / Contact Link</label>
                <input type="text" placeholder="Enter your GitHub or portfolio link">
            </div>

            <button type="button" class="save-btn">
                Save Changes
            </button>

        </form>

    </div>

</div>

<script>
document.getElementById("avatarInput").addEventListener("change", function(event) {
    const reader = new FileReader();
    reader.onload = function(){
        document.getElementById("avatarPreview").style.backgroundImage =
            "url('" + reader.result + "')";
    };
    reader.readAsDataURL(event.target.files[0]);
});
</script>

</body>
</html>
