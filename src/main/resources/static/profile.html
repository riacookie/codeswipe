<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - CodeSwipe</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="/styles/profile.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="nav-top">
        <a href="/home" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="/project/interested" class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Interested</span>
        </a>

        <a href="/project" class="nav-item">
            <i class="fa-solid fa-folder-open"></i>
            <span>My Projects</span>
        </a>

        <a href="/profile" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <div class="nav-bottom">
        <a href="/login" class="nav-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
    </div>
</div>

<div class="logo">CodeSwipe</div>

<!-- MAIN -->
<div class="main">
    <div class="profile-card">

        <h1>My Profile</h1>

        <div class="avatar-section">
            <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()">
                <div class="avatar-preview" id="avatarPreview"></div>
                <div class="avatar-overlay">
                    <i class="fa-solid fa-camera"></i>
                </div>
            </div>
            <input type="file" id="avatarInput" style="display: none;">
        </div>

        <div class="profile-info">
            <div class="info-group">
                <label>Full Name</label>
                <input type="text" id="displayName" class="profile-input" value="John Doe">
            </div>

            <div class="info-group">
                <label>Email</label>
                <input type="email" id="displayEmail" class="profile-input" value="john@email.com" readonly>
            </div>

            <div class="info-group">
                <label>GitHub / Contact</label>
                <input type="text" id="displayContact" class="profile-input" value="github.com/johndoe">
            </div>

            <div class="info-group">
                <label>Telephone</label>
                <input type="text" id="displayPhone" class="profile-input" value="0123456789">
            </div>

            <div class="info-group">
                <label>Experience Level</label>
                <select id="displayLevel" class="profile-input">
                    <option value="Beginner" selected>Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <button class="update-btn" onclick="openConfirm()">
                Update Profile
            </button>
        </div>
    </div>
</div>

<!-- CONFIRM MODAL -->
<div class="confirm-modal" id="confirmModal">
    <div class="confirm-box">
        <h3>Confirm Update</h3>
        <p>Are you sure you want to update your profile?</p>

        <div class="confirm-actions">
            <button class="confirm-btn" onclick="confirmUpdate()">Yes</button>
            <button class="cancel-btn" onclick="closeConfirm()">No</button>
        </div>
    </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/profile.js"></script>

<script>
    function openConfirm() {
        document.getElementById("confirmModal").style.display = "flex";
    }

    function closeConfirm() {
        document.getElementById("confirmModal").style.display = "none";
    }

    function confirmUpdate() {
        closeConfirm();
        if (typeof saveProfile === "function") {
            saveProfile();
        }
    }

    document.getElementById("avatarInput").addEventListener("change", function (event) {
        const reader = new FileReader();
        reader.onload = function () {
            document.getElementById("avatarPreview").style.backgroundImage =
                "url('" + reader.result + "')";
        };
        if (event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    });
</script>

</body>
</html>
